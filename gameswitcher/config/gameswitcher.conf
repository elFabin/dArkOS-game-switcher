# dArkOS Game Switcher settings.
#
# Sourced by every switcher script.  Edit and the change takes effect on the
# next game launch - nothing needs restarting.

# How many games the carousel remembers.
GS_MAX_RECENTS=12

# RetroArch's network command port.  Matches network_cmd_port in retroarch.cfg.
GS_RA_PORT=55355

# Re-run perfmax when switching games, so the new game gets its launch splash.
# Off by default: it's a second DRM/KMS client (image-viewer) landing right
# in the handover between one game and the next, plus a ~/.asoundrc deletion
# on rk3326 that only EmulationStation's own game-end hook restores.  Set to
# 1 if you'd rather have the splash back and can live with those costs.
GS_SHOW_SPLASH=0

# Seconds to wait for RetroArch to save its state and quit before forcing it.
# Raise this if a large core is getting cut off mid-save.
GS_QUIT_TIMEOUT=10

# Seconds to wait for the screenshot to land before giving up on a thumbnail.
GS_SHOT_TIMEOUT=5

# What opens the switcher while a game is running: fn, power, or both.
# fn is a clean tap of the Fn/system_hk button -- a hold, or any other button
# pressed while it's held, is left alone for ogage's own combos (brightness,
# volume, shutdown).  Switching to or from "power"/"both" needs a reinstall,
# since only that mode touches the system pause.sh file; switching back to
# "fn" alone takes effect immediately.
GS_TRIGGER=fn

# The Fn button's evdev code and device name.  708 (BTN_TRIGGER_HAPPY5) is
# the A10 Mini's Fn/system_hk button.  Leave GS_HOTKEY_DEVICE blank to match
# any device that can emit the code, rather than requiring an exact name; use
# Options > Advanced > Game Switcher Button to learn the right values on a
# different device.
GS_HOTKEY_CODE=708
GS_HOTKEY_DEVICE=

# Log switches, screenshot attempts and UI starts, with timestamps, to
# ~/.config/gameswitcher/gameswitcher.log.  Useful for reporting a problem;
# noisy for everyday use, so it's off by default.
GS_DEBUG=0
