# dArkOS Game Switcher settings.
#
# Sourced by every switcher script.  Edit and the change takes effect on the
# next game launch - nothing needs restarting.

# How many games the carousel remembers.
GS_MAX_RECENTS=12

# RetroArch's network command port.  Matches network_cmd_port in retroarch.cfg.
GS_RA_PORT=55355

# Re-run perfmax when switching games, so the new game gets its launch splash.
# Set to 0 if you would rather the switch went straight to the game.
GS_SHOW_SPLASH=1

# Seconds to wait for RetroArch to save its state and quit before forcing it.
# Raise this if a large core is getting cut off mid-save.
GS_QUIT_TIMEOUT=10

# Seconds to wait for the screenshot to land before giving up on a thumbnail.
GS_SHOT_TIMEOUT=3
